name: Publish Harrison site content snapshot
on:
  schedule:
    - cron: '7 0,6,12,18 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: harrison-site-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch published public site content
        run: node scripts/refresh-site-content.mjs
      - name: Commit only changed snapshot
        run: |
          git add public/content/harrison-site-bundle.json
          if ! git diff --cached --quiet; then
            git -c user.name='Harrison content publisher' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'content: refresh published Harrison site snapshot'
            git push
          fi
