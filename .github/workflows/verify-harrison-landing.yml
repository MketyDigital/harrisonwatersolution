name: Harrison landing verification
on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'package*.json'
      - '.github/workflows/**'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --check public/admin/app.js
      - run: node --check public/js/site-content.js
      - run: node --check public/js/landing-pixels.js
      - run: npm test
      - run: npm run build
