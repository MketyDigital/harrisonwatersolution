painHeading: Stop guessing about the expensive parts of starting a water factory
painPoints:
  - Registration, licensing and government requirements feel confusing.
  - You are unsure which treatment equipment you actually need.
  - You are worried about buying substandard or unsuitable machinery.
  - You do not know your true production cost or real profit per bag or pack.
  - You do not know the total capital required before you start.
