    text: Understand the major machine and treatment-system cost categories before requesting quotations.
  - title: Real Cost Breakdown
    text: Work through the expenses that determine your actual cost per bag or pack.
  - title: Production Flow Diagram
    text: See how water treatment, production, packaging and finished-goods movement should connect.
  - title: Sample Factory Example
    text: Use a worked example to understand room arrangement and factory workflow.
videosHeading: Watch Before You Buy
