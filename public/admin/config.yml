backend:
  name: github
  repo: MketyDigital/harrison-water-solution
  branch: main
  auth_methods: [oauth]
  base_url: https://cms-auth.harrisonwatersolution.com

media_folder: /public/uploads
public_folder: /uploads
media_libraries:
  default:
    config:
      max_file_size: 5242880
      slugify_filename: true

collections:
  - name: settings
    label: Website Settings
    files:
      - name: site
        label: Branding, Contact & SEO
        file: src/content/settings/site.yml
        fields:
          - {name: companyName, label: Company Name, widget: string}
          - {name: siteUrl, label: Website URL, widget: string}
          - {name: logo, label: Logo, widget: image, required: false}
          - {name: favicon, label: Favicon, widget: image, required: false}
          - name: brand
            label: Brand Colours
            widget: object
            fields:
              - {name: primary, label: Primary Colour, widget: color}
              - {name: secondary, label: Secondary Colour, widget: color}
              - {name: accent, label: Accent Colour, widget: color}
          - name: contact
            label: Contact Details
            widget: object
            fields:
              - {name: phone, label: Phone, required: false}
              - {name: whatsapp, label: WhatsApp Link, widget: string, required: false}
              - {name: email, label: Email, required: false}
              - {name: address, label: Address, required: false}
              - {name: openingHours, label: Opening Hours, required: false}
          - name: socials
            label: Social Media
            widget: list
            fields:
              - {name: label, label: Platform}
              - {name: url, label: URL}
          - name: seo
            label: Default SEO
            widget: object
            fields:
              - {name: title, label: Default Page Title}
              - {name: description, label: Default Description, widget: text}
              - {name: shareImage, label: Social Share Image, widget: image, required: false}
  - name: pages
    label: Main Pages
    files:
      - {name: home, label: Home Page, file: src/content/pages/home.yml, fields: [{name: title, label: Internal Title},{name: hero, label: Hero, widget: object, fields: [{name: eyebrow,label: Eyebrow},{name: heading,label: Heading},{name: text,label: Text,widget: text},{name: primaryCta,label: Primary Button},{name: secondaryCta,label: Secondary Button}]},{name: servicesHeading,label: Services Heading},{name: productsHeading,label: Products Heading},{name: whyHeading,label: Why Harrison Heading},{name: whyItems,label: Why Harrison Items,widget: list,fields: [{name:title,label:Title},{name:text,label:Text,widget:text}]},{name: projectsHeading,label: Projects Heading},{name: processHeading,label: Process Heading},{name: process,label: Process Steps,widget:list,fields:[{name:title,label:Title},{name:text,label:Text,widget:text}]},{name: ctaHeading,label: CTA Heading},{name: ctaText,label: CTA Text,widget:text}]}
      - {name: about, label: About Page, file: src/content/pages/about.yml, fields: [{name:title,label:Page Title},{name:heading,label:Heading},{name:intro,label:Introduction,widget:text},{name:body,label:About Text,widget:text},{name:expertise,label:Expertise Areas,widget:list}]}
      - {name: contact, label: Contact Page, file: src/content/pages/contact.yml, fields: [{name:title,label:Page Title},{name:heading,label:Heading},{name:text,label:Intro Text,widget:text},{name:formEnabled,label:Enable Quote Form,widget:boolean}]}
      - name: ebook
        label: eBook Landing Page
        file: src/content/pages/ebook.yml
        fields:
          - {name: title, label: eBook Title}
          - {name: price, label: Display Price}
          - {name: oldPrice, label: Old Price, required: false}
          - {name: currencyLabel, label: Currency Label}
          - {name: primaryPaymentUrl, label: Primary Payment Link, required: false}
          - {name: nigeriaPaymentUrl, label: Nigeria Payment Link, required: false}
          - {name: internationalPaymentUrl, label: International Payment Link, required: false}
          - {name: buyButtonLabel, label: Buy Button Text}
          - {name: announcement, label: Top Announcement, widget: text}
          - {name: hero, label: Hero, widget: object, fields: [{name:eyebrow,label:Eyebrow},{name:heading,label:Heading},{name:text,label:Subheading,widget:text}]}
          - {name: painHeading, label: Problem Section Heading}
          - {name: painPoints, label: Pain Points, widget: list}
          - {name: introHeading, label: Introduction Heading}
          - {name: introText, label: Introduction Text, widget: text}
          - {name: authorHeading, label: Author/Authority Heading}
          - {name: authorText, label: Author/Authority Text, widget: text}
          - {name: benefitsHeading, label: Benefits Heading}
          - {name: benefits, label: What You'll Learn, widget: list}
          - {name: previews, label: Book Previews, widget: list, fields: [{name:title,label:Title},{name:text,label:Text,widget:text}]}
          - {name: videosHeading, label: Videos Heading}
          - {name: whoHeading, label: Who It's For Heading}
          - {name: whoItems, label: Who It's For, widget: list}
          - {name: testimonialsHeading, label: Testimonials Heading}
          - {name: workHeading, label: Work Done Heading}
          - {name: bonusHeading, label: Bonus Heading}
          - {name: bonuses, label: Bonuses, widget: list}
          - {name: faqHeading, label: FAQ Heading}
          - {name: finalHeading, label: Final CTA Heading}
          - {name: finalText, label: Final CTA Text, widget: text}
  - name: products
    label: Products & Machinery
    folder: src/content/products
    extension: yml
    format: yaml
    create: true
    identifier_field: name
    fields:
      - {name:name,label:Product Name}
      - {name:slug,label:URL Slug}
      - {name:category,label:Category}
      - {name:summary,label:Short Description,widget:text}
      - {name:description,label:Full Description,widget:text}
      - {name:heroImage,label:Main Image,widget:image,required:false}
      - {name:gallery,label:Gallery,widget:list,fields:[{name:image,label:Image,widget:image},{name:alt,label:Image Description}]}
      - {name:applications,label:Applications,widget:list}
      - {name:specifications,label:Specifications,widget:list,fields:[{name:label,label:Specification},{name:value,label:Value}]}
      - {name:price,label:Price or leave blank for Request Quote,required:false}
      - {name:featured,label:Featured,widget:boolean,default:false}
      - {name:order,label:Display Order,widget:number,default:99}
      - {name:seoTitle,label:SEO Title,required:false}
      - {name:seoDescription,label:SEO Description,widget:text,required:false}
  - name: services
    label: Services
    folder: src/content/services
    extension: yml
    format: yaml
    create: true
    identifier_field: name
    fields:
      - {name:name,label:Service Name}
      - {name:slug,label:URL Slug}
      - {name:summary,label:Summary,widget:text}
      - {name:description,label:Full Description,widget:text}
      - {name:deliverables,label:Key Deliverables,widget:list}
      - {name:idealFor,label:Ideal Clients / Use Cases,widget:list}
      - {name:heroImage,label:Main Image,widget:image,required:false}
      - {name:gallery,label:Gallery,widget:list,fields:[{name:image,label:Image,widget:image},{name:alt,label:Image Description}]}
      - {name:featured,label:Featured,widget:boolean,default:false}
      - {name:order,label:Display Order,widget:number,default:99}
      - {name:seoTitle,label:SEO Title,required:false}
      - {name:seoDescription,label:SEO Description,widget:text,required:false}
  - name: projects
    label: Work Done / Projects
    folder: src/content/projects
    extension: yml
    format: yaml
    create: true
    identifier_field: title
    fields:
      - {name:title,label:Project Title}
      - {name:slug,label:Slug}
      - {name:summary,label:Summary,widget:text}
      - {name:location,label:Location,required:false}
      - {name:heroImage,label:Main Image,widget:image,required:false}
      - {name:gallery,label:Gallery,widget:list,fields:[{name:image,label:Image,widget:image},{name:alt,label:Image Description}]}
      - {name:featured,label:Show Publicly,widget:boolean,default:true}
      - {name:order,label:Display Order,widget:number,default:99}
  - name: testimonials
    label: Testimonials
    folder: src/content/testimonials
    extension: yml
    format: yaml
    create: true
    identifier_field: name
    fields:
      - {name:name,label:Customer Name}
      - {name:role,label:Role/Company,required:false}
      - {name:location,label:Location,required:false}
      - {name:quote,label:Testimonial,widget:text}
      - {name:image,label:Photo or Screenshot,widget:image,required:false}
      - {name:featured,label:Show Publicly,widget:boolean,default:true}
      - {name:order,label:Display Order,widget:number,default:99}
  - name: videos
    label: Videos
    folder: src/content/videos
    extension: yml
    format: yaml
    create: true
    identifier_field: title
    fields:
      - {name:title,label:Video Title}
      - {name:url,label:YouTube or Vimeo URL}
      - {name:caption,label:Caption,widget:text,required:false}
      - {name:featured,label:Show Publicly,widget:boolean,default:true}
      - {name:order,label:Display Order,widget:number,default:99}
  - name: faqs
    label: FAQs
    folder: src/content/faqs
    extension: yml
    format: yaml
    create: true
    identifier_field: question
    fields:
      - {name:question,label:Question}
      - {name:answer,label:Answer,widget:text}
      - {name:category,label:Category,default:ebook}
      - {name:order,label:Display Order,widget:number,default:99}
